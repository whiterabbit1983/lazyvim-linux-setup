name: Shell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n tests/smoke.sh
          bash -n tests/git-smoke.sh
      - name: ShellCheck
        run: shellcheck install.sh tests/smoke.sh tests/git-smoke.sh
      - name: Upstream versions, Linux Mint detection and Git installation
        run: python3 tests/upstream_versions.py
